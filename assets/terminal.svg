<svg xmlns="http://www.w3.org/2000/svg" width="760" height="266" viewBox="0 0 760 266" role="img" aria-label="A terminal that types: whoami, research assistant at the University of Foggia; cat interests.txt, cybersecurity, large language models, a bit of everything else">
	<style>
		.t{animation-duration:16.20s;animation-timing-function:steps(28,end);animation-iteration-count:infinite}
		.t0{animation-name:type0}.t1{animation-name:type1}.t3{animation-name:type3}.t4{animation-name:type4}.t5{animation-name:type5}.t6{animation-name:type6}
		@keyframes type0{0%,0.20%{width:0}9.75%,96%{width:708px}100%{width:0}}@keyframes type1{0%,10.86%{width:0}20.41%,96%{width:708px}100%{width:0}}@keyframes type3{0%,32.57%{width:0}42.13%,96%{width:708px}100%{width:0}}@keyframes type4{0%,43.43%{width:0}52.98%,96%{width:708px}100%{width:0}}@keyframes type5{0%,54.29%{width:0}63.84%,96%{width:708px}100%{width:0}}@keyframes type6{0%,65.14%{width:0}74.70%,96%{width:708px}100%{width:0}}
		.cursor{animation:blink 1.1s steps(1,end) infinite}
		@keyframes blink{0%,49%{opacity:1}50%,99%{opacity:0}100%{opacity:1}}
	</style>
	<rect x="1" y="1" width="758" height="264" rx="14" fill="#111111" stroke="#d42a3c" stroke-opacity="0.35"/>
	<path d="M1 15a14 14 0 0 1 14-14h730a14 14 0 0 1 14 14v27H1z" fill="#d42a3c" fill-opacity="0.1"/>
	<circle cx="26" cy="21" r="5" fill="#d42a3c"/>
	<circle cx="46" cy="21" r="5" fill="#d42a3c" fill-opacity="0.55"/>
	<circle cx="66" cy="21" r="5" fill="#d42a3c" fill-opacity="0.28"/>
	<text x="380" y="26" text-anchor="middle" fill="#7a7a86" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">andrea@foggia</text>
	<mask id="line0"><rect class="t t0" x="26" y="66" width="0" height="24" fill="#fff"/></mask>
	<text x="26" y="82" mask="url(#line0)" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan fill="#d42a3c">$</tspan> <tspan fill="#e6e6ea">whoami</tspan></text>
	<mask id="line1"><rect class="t t1" x="26" y="90" width="0" height="24" fill="#fff"/></mask>
