	<mask id="line3"><rect class="t t3" x="26" y="138" width="0" height="24" fill="#fff"/></mask>
	<text x="26" y="154" mask="url(#line3)" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan fill="#d42a3c">$</tspan> <tspan fill="#e6e6ea">cat interests.txt</tspan></text>
	<mask id="line4"><rect class="t t4" x="26" y="162" width="0" height="24" fill="#fff"/></mask>
	<text x="26" y="178" mask="url(#line4)" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan fill="#9a9aa4">cybersecurity</tspan></text>
	<mask id="line5"><rect class="t t5" x="26" y="186" width="0" height="24" fill="#fff"/></mask>
	<text x="26" y="202" mask="url(#line5)" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan fill="#9a9aa4">large language models</tspan></text>
