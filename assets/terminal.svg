	<text x="26" y="226" mask="url(#line6)" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan fill="#9a9aa4">a bit of everything else</tspan></text>
	<text x="26" y="250" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan fill="#d42a3c">$</tspan> <tspan class="cursor" fill="#e6e6ea">_</tspan></text>
</svg>
