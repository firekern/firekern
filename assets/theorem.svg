<svg xmlns="http://www.w3.org/2000/svg" width="720" height="175" viewBox="0 0 720 175" role="img" aria-label="Proposition 9.20. The energy required to start writing exceeds the energy required to write.">
	<rect width="720" height="175" rx="14" fill="#1c1c22"/>
	<rect x="0.5" y="0.5" width="719" height="174" rx="13.5" fill="none" stroke="#E5397F" stroke-opacity="0.35"/>
	<rect x="0" y="0" width="4" height="175" rx="2" fill="#E5397F"/>
	<mask id="type0"><rect x="26" y="29" width="0" height="23" fill="#fff">
		<animate attributeName="width" from="0" to="668" begin="0.00s" dur="0.55s" fill="freeze"/>
	</rect></mask>
	<text x="26" y="46" mask="url(#type0)" fill="#E5397F" font-weight="600" font-style="normal" font-size="16.5" font-family="ui-serif, Georgia, 'Times New Roman', serif">Proposition 9.20 (Porcelli, 2026).</text>
	<mask id="type1"><rect x="26" y="52" width="0" height="23" fill="#fff">
		<animate attributeName="width" from="0" to="668" begin="0.55s" dur="0.55s" fill="freeze"/>
	</rect></mask>
	<text x="26" y="69" mask="url(#type1)" fill="#d7d7de" font-weight="400" font-style="normal" font-size="16.5" font-family="ui-serif, Georgia, 'Times New Roman', serif">The energy required to start writing exceeds the energy</text>
	<mask id="type2"><rect x="26" y="75" width="0" height="23" fill="#fff">
		<animate attributeName="width" from="0" to="668" begin="1.10s" dur="0.55s" fill="freeze"/>
	</rect></mask>
	<text x="26" y="92" mask="url(#type2)" fill="#d7d7de" font-weight="400" font-style="normal" font-size="16.5" font-family="ui-serif, Georgia, 'Times New Roman', serif">required to write.</text>
	<mask id="type3"><rect x="26" y="98" width="0" height="23" fill="#fff">
		<animate attributeName="width" from="0" to="668" begin="1.65s" dur="0.55s" fill="freeze"/>
	</rect></mask>
	<text x="26" y="115" mask="url(#type3)" fill="#d7d7de" font-weight="400" font-style="normal" font-size="16.5" font-family="ui-serif, Georgia, 'Times New Roman', serif"></text>
	<mask id="type4"><rect x="26" y="121" width="0" height="23" fill="#fff">
		<animate attributeName="width" from="0" to="668" begin="2.20s" dur="0.55s" fill="freeze"/>
	</rect></mask>
	<text x="26" y="138" mask="url(#type4)" fill="#8b8b96" font-weight="400" font-style="italic" font-size="16.5" font-family="ui-serif, Georgia, 'Times New Roman', serif">Proof. Both are measurable. Only the first is ever spent.  ∎</text>
</svg>
